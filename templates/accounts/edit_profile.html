<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLeC — Edit Profile</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0e0;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #f5a623;
      padding: 2.5rem 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f5a623;
      text-transform: uppercase;
    }

    .logo p {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .success-banner {
      background: #0a1e0f;
      border: 1px solid #1a5c2a;
      color: #6ee07a;
      font-size: 0.8rem;
      padding: 0.65rem 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.5rem;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #f5a623;
    }

    ul.errorlist {
      list-style: none;
      background: #1e0a0a;
      border: 1px solid #5c1a1a;
      color: #e07070;
      font-size: 0.8rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }

    ul.errorlist li { margin: 0; }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 1.5rem 0;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: #f5a623;
      color: #0d0d0d;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.25rem;
    }

    button[type="submit"]:hover { background: #e09510; }

    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.08em;
    }

    .footer-links a {
      color: #888;
      text-decoration: none;
    }

    .footer-links a:hover { color: #f5a623; }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <h1>PLeC</h1>
      <p>Edit Profile</p>
    </div>

    {% if request.GET.saved %}
      <div class="success-banner">✓ Profile updated successfully.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="form-row">
        <div class="form-group">
          <label for="id_first_name">First Name</label>
          {{ form.first_name.errors }}
          <input type="text"
                 id="id_first_name"
                 name="first_name"
                 value="{{ form.first_name.value|default:'' }}"
                 autocomplete="given-name"
                 placeholder="Optional">
        </div>
        <div class="form-group">
          <label for="id_last_name">Last Name</label>
          {{ form.last_name.errors }}
          <input type="text"
                 id="id_last_name"
                 name="last_name"
                 value="{{ form.last_name.value|default:'' }}"
                 autocomplete="family-name"
                 placeholder="Optional">
        </div>
      </div>

      <div class="form-group">
        <label for="id_email">Email Address</label>
        {{ form.email.errors }}
        <input type="email"
               id="id_email"
               name="email"
               value="{{ form.email.value|default:'' }}"
               autocomplete="email"
               required>
      </div>

      <hr class="divider">

      <button type="submit">Save Changes</button>
    </form>

    <div class="footer-links">
      <a href="/profile/">← My Results</a>
      <a href="/password-change/">Change Password</a>
    </div>

  </div>
</body>
</html>
