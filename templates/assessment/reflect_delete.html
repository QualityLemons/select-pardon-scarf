<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLeC — Delete Reflection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d0d0d; font-family: 'Courier New', Courier, monospace; color: #e0e0e0;
    }
    .card {
      width: 100%; max-width: 520px; background: #141414;
      border: 1px solid #2a2a2a; border-top: 3px solid #e07070; padding: 2.5rem 2rem;
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.15em; color: #f5a623; text-transform: uppercase; }
    .logo p { font-size: 0.75rem; color: #666; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.25rem; }

    .warning {
      background: #1e0a0a; border: 1px solid #5c1a1a; color: #e07070;
      font-size: 0.82rem; padding: 0.75rem 1rem; margin-bottom: 1.75rem; letter-spacing: 0.04em;
    }

    .entry-preview {
      background: #111; border: 1px solid #1e1e1e; border-left: 3px solid #333;
      padding: 1rem 1.1rem; margin-bottom: 1.75rem;
    }
    .entry-meta { font-size: 0.7rem; color: #555; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.6rem; }
    .entry-notes { font-size: 0.85rem; color: #888; line-height: 1.5; }

    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 1.5rem 0; }
    .actions { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }

    button[type="submit"] {
      padding: 0.75rem 1.75rem; background: #7a1a1a; color: #e0e0e0; border: none;
      font-family: inherit; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer; transition: background 0.2s;
    }
    button[type="submit"]:hover { background: #a02020; }
    .cancel-link { font-size: 0.78rem; color: #888; text-decoration: none; letter-spacing: 0.08em; }
    .cancel-link:hover { color: #f5a623; }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo">
      <h1>PLeC</h1>
      <p>Delete Reflection</p>
    </div>

    <div class="warning">⚠ This will permanently delete this reflection entry. This cannot be undone.</div>

    <div class="entry-preview">
      <div class="entry-meta">
        {{ entry.level }}{% if entry.skill %} · {{ entry.skill }}{% endif %}
        &nbsp;·&nbsp; {{ entry.created_at|date:"d M Y, H:i" }}
      </div>
      <p class="entry-notes">{{ entry.notes|truncatechars:200 }}</p>
    </div>

    <hr class="divider">

    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <button type="submit">Yes, delete it</button>
        <a class="cancel-link" href="/reflect/{{ entry.pk }}/edit/">← Keep this entry</a>
      </div>
    </form>

  </div>
</body>
</html>
