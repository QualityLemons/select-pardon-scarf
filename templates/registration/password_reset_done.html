<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLeC — Reset Email Sent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0e0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #f5a623;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f5a623;
      text-transform: uppercase;
    }

    .logo p {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.25rem;
      margin-bottom: 2rem;
    }

    .info-msg {
      background: #0a0e1e;
      border: 1px solid #1a2a5c;
      color: #7090e0;
      font-size: 0.82rem;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.04em;
      line-height: 1.6;
      text-align: left;
    }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.75rem;
      background: #f5a623;
      color: #0d0d0d;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #e09510;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>PLeC</h1>
      <p>Check Your Email</p>
    </div>

    <div class="info-msg">
      If an account exists for that email address, a reset link has been sent.
      Check your inbox and follow the instructions to set a new password.
    </div>

    <a href="/login/" class="btn">Back to Sign In</a>
  </div>
</body>
</html>
