<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLeC — Reset Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0e0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #f5a623;
      padding: 2.5rem 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f5a623;
      text-transform: uppercase;
    }

    .logo p {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .hint {
      font-size: 0.78rem;
      color: #666;
      margin-bottom: 1.5rem;
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 0.5rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #f5a623;
    }

    ul.errorlist {
      list-style: none;
      background: #1e0a0a;
      border: 1px solid #5c1a1a;
      color: #e07070;
      font-size: 0.8rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: #f5a623;
      color: #0d0d0d;
      border: none;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background: #e09510;
    }

    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: #444;
      margin-top: 1.5rem;
      letter-spacing: 0.08em;
    }

    .footer-note a {
      color: #888;
      text-decoration: none;
    }

    .footer-note a:hover {
      color: #f5a623;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>PLeC</h1>
      <p>Password Reset</p>
    </div>

    <p class="hint">Enter your email address and a reset link will be sent to your inbox.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email">Email Address</label>
        {{ form.email.errors }}
        <input type="email" id="id_email" name="email"
               autocomplete="email" autofocus required>
      </div>
      <button type="submit">Send Reset Link</button>
    </form>

    <p class="footer-note"><a href="/login/">← Back to Sign In</a></p>
  </div>
</body>
</html>
