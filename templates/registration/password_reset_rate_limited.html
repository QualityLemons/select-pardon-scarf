<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLeC — Too Many Requests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Courier New', Courier, monospace;
      color: #e0e0e0;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-top: 3px solid #c0392b;
      padding: 2.5rem 2rem;
    }

    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #f5a623;
      text-transform: uppercase;
    }

    .logo p {
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .lockout-msg {
      background: #1e0a0a;
      border: 1px solid #5c1a1a;
      color: #e07070;
      font-size: 0.85rem;
      padding: 1rem 0.75rem;
      margin-bottom: 1.5rem;
      letter-spacing: 0.05em;
      line-height: 1.6;
    }

    .lockout-msg strong {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: #e08080;
    }

    .countdown-wrap {
      text-align: center;
      margin-top: 1rem;
    }

    .countdown-label {
      font-size: 0.7rem;
      color: #7a3030;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .countdown-timer {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #c0392b;
      font-variant-numeric: tabular-nums;
    }

    .countdown-timer.expired {
      color: #3a9a3a;
    }

    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: #444;
      margin-top: 1.5rem;
      letter-spacing: 0.08em;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #888;
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0.35;
      transition: color 0.3s, opacity 0.3s;
    }

    .back-link.ready {
      pointer-events: auto;
      opacity: 1;
      color: #f5a623;
    }

    .back-link.ready:hover {
      color: #ffcc55;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>PLeC</h1>
      <p>Password Reset</p>
    </div>

    <div class="lockout-msg">
      <strong>Too Many Requests</strong>
      Too many password-reset requests have been made for this address.
      Please wait for the timer below before trying again.

      <div class="countdown-wrap">
        <div class="countdown-label">Retry available in</div>
        <div class="countdown-timer" id="countdown">{{ cooldown_display }}</div>
      </div>
    </div>

    <a class="back-link" id="back-link" href="/password-reset/">← Try again</a>

    <p class="footer-note"><a href="/login/" style="color:#888;text-decoration:none;">← Back to Sign In</a></p>
  </div>

  <script>
    (function () {
      var remaining = {{ cooldown_seconds|default:0 }};
      var el = document.getElementById('countdown');
      var link = document.getElementById('back-link');

      function fmt(secs) {
        var h = Math.floor(secs / 3600);
        var m = Math.floor((secs % 3600) / 60);
        var s = secs % 60;
        if (h > 0) {
          return h + ':' + pad(m) + ':' + pad(s);
        }
        return pad(m) + ':' + pad(s);
      }

      function pad(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function tick() {
        if (remaining <= 0) {
          el.textContent = '00:00';
          el.classList.add('expired');
          link.classList.add('ready');
          return;
        }
        el.textContent = fmt(remaining);
        remaining -= 1;
        setTimeout(tick, 1000);
      }

      if (remaining > 0) {
        tick();
      } else {
        el.textContent = '00:00';
        el.classList.add('expired');
        link.classList.add('ready');
      }
    })();
  </script>
</body>
</html>
